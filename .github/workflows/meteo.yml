name: Meteo

# Récupère la météo (Open-Meteo, sinon MET Norway en secours) et l'enregistre dans meteo.json.
# La page de l'iPad lit ce fichier (même site, donc autorisé en mode plein écran iOS 9).
# Déclenché toutes les 15 min par cron-job.org (le planning `schedule` de GitHub ne se lançait jamais).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meteo
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Recuperer la meteo
        run: python3 scripts/meteo.py

      - name: Enregistrer si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meteo.json
          if git diff --cached --quiet; then
            echo "Pas de changement"
          else
            git commit -m "Meteo : mise a jour automatique"
            git push origin main
          fi
